<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="25%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6527"/>
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#FFF5DC"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Deep Luxury Obsidian Radial Gradient -->
    <radialGradient id="spaceDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="60%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>

    <!-- Shimmer Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Star Symbol -->
    <g id="star4">
      <path d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFBF2"/>
    </g>
    <g id="starSmall">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="url(#goldGrad)"/>
    </g>
  </defs>

  <!-- Base Crest Background Circle -->
  <circle cx="250" cy="250" r="236" fill="url(#spaceDark)"/>
  
  <!-- Outer Gold Luxury Border Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>

  <!-- Celestial Coordinate Accent Pips -->
  <circle cx="250" cy="18" r="3" fill="url(#goldGrad)"/>
  <circle cx="250" cy="482" r="3" fill="url(#goldGrad)"/>
  <circle cx="18" cy="250" r="3" fill="url(#goldGrad)"/>
  <circle cx="482" cy="250" r="3" fill="url(#goldGrad)"/>

  <!-- Handloom Weave Texture (Lower Left Quadrant) -->
  <g opacity="0.22" stroke="url(#goldGrad)" stroke-width="1">
    <!-- Diagonal Warp/Weft Pattern -->
    <line x1="80" y1="280" x2="220" y2="420"/>
    <line x1="95" y1="265" x2="235" y2="405"/>
    <line x1="110" y1="250" x2="250" y2="390"/>
    <line x1="125" y1="235" x2="265" y2="375"/>
    <line x1="140" y1="220" x2="280" y2="360"/>
    <line x1="155" y1="205" x2="295" y2="345"/>

    <line x1="220" y1="280" x2="80" y2="420"/>
    <line x1="235" y1="265" x2="95" y2="405"/>
    <line x1="250" y1="250" x2="110" y2="390"/>
    <line x1="265" y1="235" x2="125" y2="375"/>
    <line x1="280" y1="220" x2="140" y2="360"/>
  </g>

  <!-- Cosmic Galaxy Spiral Arms (Intertwined Handloom Linen Threads) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round">
    <!-- Spiral Thread 1 -->
    <path d="M 250,250 C 270,210 320,180 370,195 C 420,210 440,270 410,330 C 380,390 310,430 230,425 C 150,420 90,340 100,260 C 110,180 170,110 260,95 C 340,80 420,130 450,210" stroke-width="1.8" opacity="0.6"/>
    <!-- Spiral Thread 2 -->
    <path d="M 250,250 C 230,290 180,320 130,305 C 80,290 60,230 90,170 C 120,110 190,70 270,75 C 350,80 410,160 400,240 C 390,320 330,390 240,405" stroke-width="1.5" opacity="0.5"/>
    <!-- Spiral Thread 3 (Fine Inner Galaxy Swirl) -->
    <path d="M 250,250 C 275,225 315,225 335,245 C 355,265 350,305 325,325 C 300,345 255,340 235,315 C 215,290 225,250 250,230 C 280,210 330,220 350,250" stroke-width="2.2" opacity="0.85"/>
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="250" cy="250" rx="175" ry="85" transform="rotate(-30 250 250)" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7"/>
    <ellipse cx="250" cy="250" rx="140" ry="60" transform="rotate(35 250 250)" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  </g>

  <!-- Radiating Thread Arcs from Shuttle -->
  <g fill="none" stroke="url(#goldHighlight)" stroke-linecap="round" opacity="0.75">
    <path d="M 180,320 C 140,310 110,270 120,210 C 130,160 180,120 240,125" stroke-width="1.5"/>
    <path d="M 195,305 C 160,295 135,260 142,215 C 150,175 190,140 245,142" stroke-width="1.2"/>
    <path d="M 210,290 C 180,280 160,250 165,220 C 170,190 200,160 250,160" stroke-width="1"/>
    
    <path d="M 320,180 C 360,190 390,230 380,290 C 370,340 320,380 260,375" stroke-width="1.5"/>
    <path d="M 305,195 C 340,205 365,240 358,285 C 350,325 310,360 255,358" stroke-width="1.2"/>
  </g>

  <!-- Celestial Constellation Stars & Stardust -->
  <use href="#star4" x="355" y="145"/>
  <use href="#star4" x="145" y="355"/>
  <use href="#star4" x="385" y="320"/>
  <use href="#star4" x="120" y="190"/>
  <use href="#starSmall" x="250" y="105"/>
  <use href="#starSmall" x="315" y="95"/>
  <use href="#starSmall" x="405" y="240"/>
  <use href="#starSmall" x="100" y="270"/>
  <use href="#starSmall" x="200" y="410"/>
  <use href="#starSmall" x="330" y="400"/>
  <use href="#starSmall" x="275" y="165"/>

  <!-- Fine Stardust Particles -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <circle cx="280" cy="135" r="1.5"/>
    <circle cx="340" cy="180" r="1.8"/>
    <circle cx="365" cy="220" r="1.2"/>
    <circle cx="370" cy="265" r="1.6"/>
    <circle cx="350" cy="295" r="1.4"/>
    <circle cx="310" cy="350" r="1.7"/>
    <circle cx="160" cy="310" r="1.3"/>
    <circle cx="140" cy="245" r="1.5"/>
    <circle cx="170" cy="165" r="1.2"/>
    <circle cx="220" cy="115" r="1.4"/>
  </g>

  <!-- Central Handloom Weaver's Shuttle (The Core Anchor) -->
  <g transform="rotate(-40 250 250)">
    <!-- Shuttle Outer Shadow / Glow -->
    <path d="M 175,250 C 205,232 295,232 325,250 C 295,268 205,268 175,250 Z" 
          fill="#060910" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>

    <!-- Shuttle Body in Polished Wood / Gold Grain -->
    <path d="M 175,250 C 205,232 295,232 325,250 C 295,268 205,268 175,250 Z" 
          fill="url(#goldGrad)"/>

    <!-- Shuttle Inner Taper & Shading -->
    <path d="M 183,250 C 210,236 290,236 317,250 C 290,264 210,264 183,250 Z" 
          fill="#1A1308" stroke="url(#goldHighlight)" stroke-width="1"/>

    <!-- Shuttle Core Cavity (Pirn / Bobbin Well) -->
    <rect x="210" y="242" width="80" height="16" rx="8" fill="#0C0F17" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Bobbin Wound with Golden Silk / Linen Thread -->
    <g stroke="url(#goldHighlight)" stroke-width="1.6" opacity="0.95">
      <line x1="220" y1="243" x2="220" y2="257"/>
      <line x1="225" y1="243" x2="225" y2="257"/>
      <line x1="230" y1="243" x2="230" y2="257"/>
      <line x1="235" y1="243" x2="235" y2="257"/>
      <line x1="240" y1="243" x2="240" y2="257"/>
      <line x1="245" y1="243" x2="245" y2="257"/>
      <line x1="250" y1="243" x2="250" y2="257"/>
      <line x1="255" y1="243" x2="255" y2="257"/>
      <line x1="260" y1="243" x2="260" y2="257"/>
      <line x1="265" y1="243" x2="265" y2="257"/>
      <line x1="270" y1="243" x2="270" y2="257"/>
      <line x1="275" y1="243" x2="275" y2="257"/>
      <line x1="280" y1="243" x2="280" y2="257"/>
    </g>

    <!-- Shuttle Steel Pointed Tips -->
    <polygon points="175,250 190,246 190,254" fill="url(#goldHighlight)"/>
    <polygon points="325,250 310,246 310,254" fill="url(#goldHighlight)"/>
    
    <!-- Fine Thread Trailing From Eyelet -->
    <circle cx="288" cy="250" r="2.5" fill="#FFF5DC"/>
    <path d="M 288,250 Q 300,245 330,230" fill="none" stroke="#FFF5DC" stroke-width="1.2"/>
  </g>

  <!-- Luminous Center Star Sparkle -->
  <use href="#star4" x="250" y="250" transform="scale(0.85) translate(44, 44)" filter="url(#goldGlow)"/>
</svg>
